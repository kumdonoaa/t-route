# $ python3 -m nwm_routing -f -V4 conus_hyfeatures.yaml
#--------------------------------------------------------------------------------
log_parameters:
    #----------
    showtiming: True
    log_level : DEBUG
#--------------------------------------------------------------------------------
network_topology_parameters:
    #----------
    supernetwork_parameters:
        #----------
        geo_file_path: /home/quinn/Mapping_V2_V3/hf3_remap/output/gage-01378500/config/gage-01378500_subset.gpkg
        columns: 
            key: 'id'
            downstream: 'toid'
            dx : 'Length_m'
            n : 'n'
            ncc : 'nCC'
            s0 : 'So'
            bw : 'BtmWdth'
            waterbody : 'WaterbodyID'
            gages : 'gage'
            tw : 'TopWdth'
            twcc : 'TopWdthCC'
            musk : 'MusK'
            musx : 'MusX'
            cs : 'ChSlp'
            alt: 'alt'
            mainstem: 'mainstem'
            reference_id: 'reference_id'
    waterbody_parameters:
        #----------
        break_network_at_waterbodies: False  
#--------------------------------------------------------------------------------
compute_parameters:
    #----------
    parallel_compute_method: by-subnetwork-jit-clustered # serial
    compute_kernel         : V02-structured
    assume_short_ts        : False
    subnetwork_target_size : 1000
    cpu_pool               : 36
    restart_parameters:
        #----------
        start_datetime              : 2019-05-01_01:00
        lite_channel_restart_file   : #restart/RESTART.2020082600_DOMAIN1
        lite_waterbody_restart_file : #restart/waterbody_restart_202006011200
    hybrid_parameters:
        run_hybrid_routing: False
        diffusive_domain  : #domain/coastal_domain_subset.yaml  
        use_natl_xsections: False
        topobathy_domain  : #domain/final_diffusive_natural_xs.nc 
        run_refactored_network: False
        refactored_domain: #domain/refactored_coastal_domain_subset.yaml 
        refactored_topobathy_domain: #domain/refac_final_diffusive_natural_xs.nc 
        coastal_boundary_domain: #domain/coastal_domain_crosswalk.yaml
    forcing_parameters:
        #----------
        qts_subdivisions            : 12
        dt                          : 300 # [sec]
        qlat_input_folder           :  /home/quinn/Mapping_V2_V3/hf3_remap/output/gage-01378500/outputs/ngen
        qlat_file_pattern_filter    : "cat-*"
        coastal_boundary_input_file : #boundary_forcing  
        nts                         : 288 # 288 for 1day; 2592 for 9 days
        max_loop_size               : 128   # [hr]  
    data_assimilation_parameters:
        #----------
        streamflow_da:
            #----------
            streamflow_nudging            : False
            diffusive_streamflow_nudging  : False                               
        reservoir_da:
            #----------
            reservoir_persistence_da:
                #----------
                reservoir_persistence_usgs  : False
                reservoir_persistence_usace : False
            reservoir_rfc_da:
                #----------
                reservoir_rfc_forecasts                 : False
